function viewAnalysis() {
  const root = el("div");
  const A = D.analysis || {};
  root.appendChild(el("div", { class: "sub", style: "color:var(--muted);margin-bottom:10px" },
    "the lab — how the agents behave, not just how they score · more panels unlock " +
    "with v3 (event ledger, ghost books) and as sample sizes grow"));

  /* --- calibration --- */
  const calPP = A.calibration_by_panelist || {};
  const scoredTotal = Object.values(calPP)
    .flatMap(b => Object.values(b)).reduce((s, v) => s + v[1], 0);
  const calCard = el("div", { class: "card" },
    el("h2", null, "Calibration by panelist"),
    el("div", { class: "sub" }, "stated conviction (x) vs how often the 24h call was " +
      "right (y) · points need 3+ scored calls · on the diagonal = honest, above = " +
      "underconfident, below = overconfident"));
  if (scoredTotal >= 10) {
    const box = el("div", { class: "chartbox" });
    calCard.appendChild(el("div", { class: "legend" },
      Object.keys(calPP).map(n => el("button", { disabled: "true" },
        el("span", { class: "lkey", style: "border-top-color:" + (MODEL_COLOR[n] || "#888") }), n))));
    calCard.appendChild(box);
    calibrationChart(box, calPP);
  } else {
    calCard.appendChild(el("div", { class: "gatefoot" },
      `Needs ~10 scored directional calls to draw (have ${scoredTotal}). Calls score ` +
      "24h after they are made — check back tomorrow."));
  }
  root.appendChild(calCard);

  /* --- stance ribbons --- */
  const tsMaps = {};
  for (const [ts, name, sym, stance, conv, hit] of A.stances || [])
    (((tsMaps[sym] ??= {})[ts] ??= {})[name] = { stance, conv, hit });
  const ribCard = el("div", { class: "card" },
    el("h2", null, "Stances vs price"),
    el("div", { class: "sub" }, "each strip is one panelist's blind call per cycle — " +
      "green long, red short, grey flat, brighter = more conviction · hover any block"));
  let drewRibbon = false;
  for (const sym of D.meta.universe) {
    const series = (D.price_history || {})[sym] || [];
    if (series.length < 8 || !tsMaps[sym]) continue;
    drewRibbon = true;
    ribCard.appendChild(el("div", { style: "margin:12px 0 2px;font-weight:600;font-size:12px" }, sym));
    const box = el("div", { class: "chartbox" });
    ribCard.appendChild(box);
    stanceRibbon(box, sym, series, tsMaps[sym]);
  }
  if (!drewRibbon)
    ribCard.appendChild(el("div", { class: "gatefoot" },
      "Needs ~8 cycles of recorded stances (stance logging began at cycle #2). " +
      "This fills in within a couple of days."));
  root.appendChild(ribCard);

  /* --- proposal funnel --- */
  const ps = D.panelists_stats || {};
  const names = D.meta.panelists.map(p => p.name).filter(n => ps[n]);
  if (names.length) {
    root.appendChild(el("div", { class: "card" },
      el("h2", null, "Proposal funnel"),
      el("div", { class: "sub" }, "an idea's life: proposed blind -> kept on own final " +
        "ballot -> reached 3/3 consensus -> executed after the risk layer"),
      el("div", { class: "scroll" }, el("table", null,
        el("thead", null, el("tr", null, el("th", null, "Panelist"),
          el("th", { class: "num" }, "Proposed"), el("th", { class: "num" }, "Kept on ballot"),
          el("th", { class: "num" }, "Reached consensus"), el("th", { class: "num" }, "Executed"),
          el("th", null, "Conversion"))),
        el("tbody", null, names.map(n => { const s = ps[n];
          return el("tr", null,
            el("td", null, el("span", { class: "armdot",
              style: "background:" + (MODEL_COLOR[n] || "#888") }), el("strong", null, n)),
            el("td", { class: "num" }, String(s.proposed)),
            el("td", { class: "num" }, String(s.survived ?? 0)),
            el("td", { class: "num" }, String(s.agreed ?? 0)),
            el("td", { class: "num" }, String(s.converted)),
            el("td", null, meterCell(s.proposed ? s.converted / s.proposed : 0,
              MODEL_COLOR[n] || "#888")));
        }))))));
  }

  /* --- pairwise agreement --- */
  const pw = A.pairwise || [];
  if (pw.length) {
    root.appendChild(el("div", { class: "card" },
      el("h2", null, "Who agrees with whom"),
      el("div", { class: "sub" }, "share of blind per-coin stances where a pair " +
        "independently landed on the same call — before seeing each other"),
      el("div", { class: "scroll" }, el("table", null,
        el("thead", null, el("tr", null, el("th", null, "Pair"),
          el("th", { class: "num" }, "Agreement"), el("th", { class: "num" }, "Samples"))),
        el("tbody", null, pw.map(p => el("tr", null,
          el("td", null,
            el("span", { class: "armdot", style: "background:" + (MODEL_COLOR[p.a] || "#888") }),
            p.a + "  +  ",
            el("span", { class: "armdot", style: "background:" + (MODEL_COLOR[p.b] || "#888") }),
            p.b),
          el("td", { class: "num" }, p.agree.toFixed(0) + "%"),
          el("td", { class: "num" }, String(p.n)))))))));
  }

  /* --- role capture --- */
  const rs = A.role_stats || {};
  const roleRows = [];
  for (const name of Object.keys(rs)) {
    for (const [role, v] of Object.entries(rs[name])) {
      if (!v.cycles) continue;
      roleRows.push(el("tr", null,
        el("td", null, el("span", { class: "armdot",
          style: "background:" + (MODEL_COLOR[name] || "#888") }), el("strong", null, name)),
        el("td", null, role),
        el("td", { class: "num" }, String(v.cycles)),
        el("td", { class: "num" }, (10 * v.open_long / v.cycles).toFixed(1)),
        el("td", { class: "num" }, (10 * v.open_short / v.cycles).toFixed(1)),
        el("td", { class: "num" }, (10 * (v.ballot_long || 0) / v.cycles).toFixed(1)),
        el("td", { class: "num" }, (10 * (v.ballot_short || 0) / v.cycles).toFixed(1))));
    }
  }
  const roleCard = el("div", { class: "card" },
    el("h2", null, "Role capture"),
    el("div", { class: "sub" }, "roles rotate every cycle — a natural experiment. " +
      "Blind columns: proposals made before the role is known (should be role-blind " +
      "since cfg f2892aad hid roles from phase 1). Ballot columns: final votes cast " +
      "after arguing the role — if these track the costume, rhetoric drags judgment"));
  if (roleRows.length) {
    roleCard.appendChild(el("div", { class: "scroll" }, el("table", null,
      el("thead", null, el("tr", null, el("th", null, "Panelist"), el("th", null, "As role"),
        el("th", { class: "num" }, "Cycles"), el("th", { class: "num" }, "Blind longs /10cy"),
        el("th", { class: "num" }, "Blind shorts /10cy"),
        el("th", { class: "num" }, "Ballot longs /10cy"),
        el("th", { class: "num" }, "Ballot shorts /10cy"))),
      el("tbody", null, roleRows))));
    roleCard.appendChild(el("div", { class: "gatefoot" },
      "Treat as noise until each model-role pair has ~10+ cycles (each model serves " +
      "each role every third cycle)."));
  } else {
    roleCard.appendChild(el("div", { class: "gatefoot" }, "No debate cycles recorded yet."));
  }
  root.appendChild(roleCard);

  /* --- debate movement over time --- */
  const cyc = [...D.cycles].reverse().filter(c => c.changed !== undefined);
  const moveCard = el("div", { class: "card" },
    el("h2", null, "Debate movement"),
    el("div", { class: "sub" }, "rolling share of panelists whose final ballot differed " +
      "from their blind take (12-cycle window) · high = the debate changes minds, " +
      "low = theatre"));
  if (cyc.length >= 8) {
    const win = 12, pts = [];
    for (let i = 0; i < cyc.length; i++) {
      const s = cyc.slice(Math.max(0, i - win + 1), i + 1);
      const rate = s.reduce((t, c) => t + (c.changed || []).length, 0) /
        (s.length * Math.max(1, D.meta.panelists.length)) * 100;
      pts.push([cyc[i].ts, +rate.toFixed(1)]);
    }
    lineChart(moveCard, [{ key: "mv", label: "minds changed", color: "#3987e5",
      data: pts, area: true }],
      { height: 170, zeroTop: true, fmtVal: v => v.toFixed(0) + "%",
        fmtTick: v => v.toFixed(0) + "%", aria: "share of panelists changing their mind" });
  } else {
    moveCard.appendChild(el("div", { class: "gatefoot" },
      `Needs ~8 cycles to draw a trend (have ${cyc.length}).`));
  }
  root.appendChild(moveCard);
  return root;
}

/* ---------- NEWS ---------- */
let newsTimer = null;

function timeAgo(unixSec) {
  const m = Math.max(0, Math.round((Date.now() / 1000 - unixSec) / 60));
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h " + (m % 60) + "m ago";
  return Math.floor(h / 24) + "d ago";
}

function viewNews() {
  const root = el("div");

  /* --- live wire --- */
  const status = el("span", { style: "color:var(--muted);font-size:12px" }, "loading…");
  const coinSel = el("select", null, el("option", { value: "" }, "all coins"),
    D.meta.universe.map(s => el("option", { value: s }, s)));
  const listBox = el("div");
  const liveCard = el("div", { class: "card" },
    el("h2", null, "Live wire"),
    el("div", { class: "sub" }, "aggregated by the Pi itself from publisher feeds and " +
      "Google News (refreshed hourly, no third-party API) — with a direct-fetch " +
      "fallback in your browser; click any story to open it"),
    el("div", { class: "filters" }, el("label", null, "coin"), coinSel,
      el("button", { class: "chip", style: "cursor:pointer;background:none",
        onclick: () => loadNews() }, "refresh"), status),
    listBox);
  root.appendChild(liveCard);

  let items = [];
  function newsRow(it, idx) {
    const a = el("a", { target: "_blank", rel: "noopener" }, it.title);
    if (/^https?:\/\//.test(it.url || "")) a.href = it.url;
    const thumb = el("div", { class: "newsthumb" });
    if (it.img) {
      const im = el("img", { loading: idx < 10 ? "eager" : "lazy",
        referrerpolicy: "no-referrer", alt: "" });
      im.onerror = () => im.remove();
      im.src = it.img;
      thumb.appendChild(im);
    }
    const meta = el("div", { class: "newsmeta" },
      (isFinite(it.published_on) ? timeAgo(it.published_on) + " · " : "") +
      (it.source || "") +
      (it.categories ? " · " + String(it.categories).split("|").slice(0, 3).join(" · ") : ""));
    if (/^https?:\/\//.test(it.url || ""))
      meta.appendChild(el("a", {
        href: "http://192.168.0.111:3461/?add=" + encodeURIComponent(it.url),
        style: "color:#fab219;margin-left:8px;text-decoration:none",
        title: "send this article to the NEWSTEST prediction testbed — the link " +
          "works on the home network where the testbed runs" }, "test →"));
    return el("div", { class: "newsrow" }, thumb,
      el("div", null, el("div", null, a), meta));
  }
  function renderList() {
    const q = coinSel.value;
    const names = { BTC: /\b(BTC|BITCOIN)\b/i, ETH: /\b(ETH|ETHER|ETHEREUM)\b/i,
      SOL: /\b(SOL|SOLANA)\b/i, XRP: /\b(XRP|RIPPLE)\b/i, DOGE: /\b(DOGE|DOGECOIN)\b/i };
    const rows = items.filter(it => !q ||
      names[q].test(it.title + " " + (it.categories || ""))).slice(0, 45);
    listBox.replaceChildren(...rows.map((it, i) => newsRow(it, i)));
    if (!rows.length) listBox.replaceChildren(
      el("div", { class: "gatefoot" }, "Nothing matching right now."));
  }

  const FEEDS = [["Cointelegraph", "https://cointelegraph.com/rss"],
                 ["CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/"],
                 ["NewsBTC", "https://www.newsbtc.com/feed/"]];
  const PROXIES = [u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
                   u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
                   u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)];

  function fetchVia(url, pi = 0) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 8000);
    return fetch(PROXIES[pi](url), { signal: ctl.signal })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .finally(() => clearTimeout(t))
      .catch(e => {
        if (pi + 1 < PROXIES.length) return fetchVia(url, pi + 1);
        throw e;
      });
  }

  function parseRss(xmlText, source) {
    const doc = new DOMParser().parseFromString(xmlText, "text/xml");
    return [...doc.querySelectorAll("item")].map(it => {
      const media = it.getElementsByTagName("media:content")[0] ||
                    it.getElementsByTagName("enclosure")[0];
      let img = media ? media.getAttribute("url") : null;
      if (!img) {
        const d = it.querySelector("description")?.textContent || "";
        const m = d.match(/<img[^>]+src=["']([^"']+)/i);
        img = m ? m[1] : null;
      }
      if (img && !/^https:\/\//.test(img)) img = null;
      return {
        title: (it.querySelector("title")?.textContent || "").trim(),
        url: (it.querySelector("link")?.textContent || "").trim(),
        source,
        published_on: Date.parse(it.querySelector("pubDate")?.textContent || "") / 1000,
        categories: [...new Set([...it.querySelectorAll("category")]
          .map(c => c.textContent.trim()).filter(Boolean))].slice(0, 4).join("|"),
        img,
      };
    }).filter(x => x.title);
  }

  function loadNews() {
    // primary: the Pi's own aggregated news.json (same-origin, instant, keyless)
    status.textContent = "loading…";
    fetch("news.json?ck=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        const ageMin = (Date.now() - Date.parse(d.generated_at || 0)) / 60e3;
        if (!(d.items || []).length || !(ageMin < 150)) throw new Error("stale");
        items = d.items.map(x => ({ title: x.title, url: x.link, source: x.source,
          published_on: x.ts, categories: (x.coins || []).join("|"), img: x.img }));
        status.textContent = items.length + " stories · aggregated on the Pi " +
          Math.max(0, Math.round(ageMin)) + "m ago";
        renderList();
      })
      .catch(loadNewsProxies);
  }

  function loadNewsProxies() {
    // fallback: fetch publisher RSS directly from the browser via CORS proxies
    status.textContent = "loading…";
    items = [];
    let done = 0, okCount = 0;
    const stamp = () => {
      const t = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      status.textContent = (items.length ? `updated ${t} · ${items.length} stories · ` : "") +
        `${okCount}/${FEEDS.length} sources` + (done < FEEDS.length ? " · loading…" : "");
      if (done === FEEDS.length && !items.length)
        status.textContent = "live feeds unreachable right now — the panel's own record below still works";
    };
    FEEDS.forEach(([src, url]) =>
      fetchVia(url).then(t => parseRss(t, src))
        .then(parsed => {
          okCount++;
          items = items.concat(parsed)
            .sort((a, b) => (b.published_on || 0) - (a.published_on || 0));
          renderList();
        })
        .catch(() => {})
        .finally(() => { done++; stamp(); }));
  }
  coinSel.addEventListener("change", renderList);
  loadNews();
  if (newsTimer) clearInterval(newsTimer);
  newsTimer = setInterval(() => {
    if (!document.body.contains(liveCard)) { clearInterval(newsTimer); return; }
    if (document.visibilityState === "visible") loadNews();
  }, 5 * 60e3);

  /* --- what the panel read --- */
  const seen = new Set();
  const rows = [];
  for (const c of D.cycles) {
    for (const h of c.headlines || []) {
      const t = hTitle(h);
      if (!t || seen.has(t)) continue;
      seen.add(t);
      const link = hLink(h);
      const a = link ? el("a", { href: link, target: "_blank", rel: "noopener",
        style: "color:var(--ink);text-decoration:none" }, t)
        : el("span", { style: "color:var(--ink)" }, t);
      rows.push(el("div", { style: "padding:8px 0;border-bottom:1px solid var(--grid)" },
        el("div", null, a),
        el("div", { style: "color:var(--muted);font-size:11.5px;margin-top:2px" },
          "read by the panel at cycle #" + c.id + " · " + dfull(c.ts) +
          (h && h.source ? " · " + h.source : ""))));
      if (rows.length >= 100) break;
    }
    if (rows.length >= 100) break;
  }
  root.appendChild(el("div", { class: "card" },
    el("h2", null, "What the panel read"),
    el("div", { class: "sub" }, "every headline that actually entered a debate, newest " +
      "first, deduplicated — the experiment's own news record (links available from " +
      "cycle #7 on)"),
    rows.length ? el("div", null, rows)
      : el("div", { class: "gatefoot" }, "No headlines recorded yet.")));
  return root;
}

      " · ", el("a", { href: "newstest.html" }, "the prediction testbed"),
      " · ", el("a", { href: "comments.html" }, "leave a comment"),
      " · ", el("a", { href: "TRADEPIT_Experiment.pdf", target: "_blank" },
      "the experiment dossier (PDF)"), "."));
}

function emptyState() {
  return el("div", { class: "card empty" },
    el("h2", null, "The pit is empty"),
    el("p", null, "No cycles have run yet. From C:\\envy\\tradepit run:"),
    el("p", null, el("code", null, "python orchestrator.py --smoke"),
      " for a historical dry run, or "),
    el("p", null, el("code", null, "python orchestrator.py --cycle"),
      " for the first live cycle (needs API keys in .env)."));
}

/* ---------- boot ---------- */
function renderMain() {
  const main = document.getElementById("main");
  if (!D || !D.arms.length || !D.meta.n_cycles) {
    main.replaceChildren(D && current === "about" ? viewAbout() : emptyState());
    return;
  }
  main.replaceChildren({ overview: viewOverview, markets: viewMarkets,
    analysis: viewAnalysis, news: viewNews, cycles: viewCycles,
    trades: viewTrades, costs: viewCosts, about: viewAbout }[current]());
}

(function boot() {
  let updateTickerFn = null;
  /* $/£ toggle: data stays USD underneath; £ converts at today's ECB rate */
  const curWrap = el("span", { class: "curwrap",
    title: "display currency — £ converts at today's ECB rate; the books run in USD" });
  const mkBtn = code => el("button", { class: CUR.code === code ? "on" : "",
    onclick: () => {
      CUR.code = code;
      localStorage.setItem("tp_cur", code);
      curWrap.querySelectorAll("button").forEach(b => b.classList.remove("on"));
      btns[code].classList.add("on");
      renderMain();
      if (updateTickerFn) updateTickerFn();
    } }, code === "GBP" ? "£" : "$");
  const btns = { USD: mkBtn("USD"), GBP: mkBtn("GBP") };
  curWrap.append(btns.USD, btns.GBP);
  document.querySelector("header.site .tagline").after(curWrap);
  fetch("https://api.frankfurter.dev/v1/latest?base=USD&symbols=GBP")
    .then(r => r.json())
    .then(d => {
      if (d && d.rates && d.rates.GBP) {
        GBP_RATE = d.rates.GBP;
        localStorage.setItem("tp_gbp_rate", GBP_RATE);
        if (CUR.code === "GBP") renderMain();
      }
    }).catch(() => {});

  /* 1970s seven-segment LED clocks — red (local time) + green (cycle countdown) */
  (function ledClocks() {
    const SEG = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd",
      "4": "fgbc", "5": "afgcd", "6": "afgcde", "7": "abc",
      "8": "abcdefg", "9": "abcdfg", "-": "g", " ": "" };
    const mkDigit = () => { const d = el("span", { class: "ld" });
      for (const s of "abcdefg") d.appendChild(el("i", { class: "s" + s }));
      return d; };
    const mkColon = cls => el("span", { class: "lcolon" + (cls ? " " + cls : "") },
      el("b", null), el("b", null));
    function buildClock(host) {
      if (!host) return null;
      const digs = [mkDigit(), mkDigit(), mkDigit(), mkDigit(), mkDigit(), mkDigit()];
      host.append(digs[0], digs[1], mkColon(""), digs[2], digs[3], mkColon("lc-c2"),
        el("span", { class: "lc-sec", style: "display:flex;gap:3px" }, digs[4], digs[5]));
      const set = (d, ch) => { const on = SEG[ch] || "";
        d.querySelectorAll("i").forEach(seg => {
          seg.classList.toggle("on", on.includes(seg.classList[0][1]));
        }); };
      return str => digs.forEach((d, i) => set(d, str[i]));
    }
    const pad2 = n => String(n).padStart(2, "0");
    /* red — local time */
    const setLocal = buildClock(document.getElementById("ledclock"));
    if (setLocal) {
      const tick = () => { const t = new Date();
        setLocal([t.getHours(), t.getMinutes(), t.getSeconds()].map(pad2).join("")); };
      tick(); setInterval(tick, 1000);
    }
    /* green — countdown to the next scheduled cycle */
    const setCd = buildClock(document.getElementById("cdclock"));
    if (setCd) {
      let next = null;
      if (D && D.cycles && D.cycles.length && D.meta.mode === "live") {
        const lastScheduled = D.cycles.find(c => c.mode !== "live-alarm") || D.cycles[0];
        next = new Date(lastScheduled.ts).getTime() +
          D.meta.cadence_hours * 3600e3 + 7 * 60e3;
      }
      const tick = () => {
        if (next == null) { setCd("------"); return; }
        let ms = next - Date.now(); if (ms < 0) ms = 0;
        const h = Math.floor(ms / 3600e3),
          m = Math.floor((ms % 3600e3) / 60e3),
          s = Math.floor((ms % 60e3) / 1000);
        setCd([h, m, s].map(pad2).join(""));
      };
      tick(); setInterval(tick, 1000);
    }
  })();

  if (D) {
    const mc = document.getElementById("modechip");
    mc.textContent = D.meta.mode === "smoke" ? "SMOKE" : "LIVE";
    mc.className = "modechip " + (D.meta.mode === "smoke" ? "smoke" : "live");
    document.getElementById("genat").textContent =
      "updated " + dfull(D.meta.generated_at) + " \u00b7 " + D.meta.n_cycles +
      (D.meta.n_cycles === 1 ? " cycle" : " cycles");
    /* BTC ticker + tab title */
    const btcNow = D.cycles[0] && D.cycles[0].prices ? D.cycles[0].prices.BTC : null;
    const bh = (D.price_history || {}).BTC || [];
    const btc24 = (btcNow && bh.length > 6) ? (btcNow / bh[bh.length - 7][1] - 1) * 100 : null;
    if (btcNow) {
      const tick = el("span", { title: "BTC at the latest cycle \u00b7 24h change" });
      document.getElementById("genat").prepend(tick, " \u00b7 ");
      updateTickerFn = () => {
        tick.replaceChildren("BTC " + px(btcNow) + " ",
          btc24 == null ? "" : el("span", { class: btc24 >= 0 ? "up" : "down" }, pct(btc24)));
        const p = findArm("panel");
        if (p && p.stats.equity != null)
          document.title = "TRADEPIT \u00b7 " + money(p.stats.equity);
      };
      updateTickerFn();
    }
    if (D.meta.mode === "live" && D.cycles.length) {
      const cdEl = el("span", { style: "margin-left:6px;color:var(--ink-2)" });
      document.getElementById("genat").appendChild(cdEl);
      const lastScheduled = D.cycles.find(c => c.mode !== "live-alarm") || D.cycles[0];
      const next = new Date(lastScheduled.ts).getTime() +
        D.meta.cadence_hours * 3600e3 + 7 * 60e3;
      const tick = () => {
        const ms = next - Date.now();
        if (ms > 0) {
          const h = Math.floor(ms / 3600e3), m = Math.ceil((ms % 3600e3) / 60e3);
          cdEl.textContent = "\u00b7 next cycle in " + (h ? h + "h " : "") + m + "m";
        } else if (ms > -45 * 60e3) cdEl.textContent = "\u00b7 next cycle due about now";
        else cdEl.textContent = "\u00b7 next cycle overdue (PC asleep?)";
      };
      tick();
      setInterval(tick, 30e3);
      // quietly reload when a new cycle's data lands
      setInterval(() => {
        if (document.visibilityState !== "visible") return;
        fetch("data.js?ck=" + Date.now(), { cache: "no-store" })
          .then(r => r.text())
          .then(t => {
            const m = t.match(/"generated_at":"([^"]+)"/);
            if (m && m[1] !== D.meta.generated_at) location.reload();
          }).catch(() => {});
      }, 10 * 60e3);
    }
    if (D.meta.mode === "smoke")
      document.getElementById("banner").appendChild(el("div", { class: "banner" },
        el("span", { class: "ic" }, "\u26a0"),
        el("span", null, "Smoke data: a historical replay with mock panelists to prove the plumbing. " +
          "Real prices, fake debaters. Live cycles will replace this page.")));
  }
  renderTabs();
  renderMain();
  addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "");
    if (tabs.some(t => t[0] === h)) { current = h; renderTabs(); renderMain(); }
  });
})();
</script>
